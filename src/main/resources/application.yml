server:
  port: 8082

spring:
  application:
    name: books-orders

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/ordersdb}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:mysql}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    hostname: unir-books-orders

## Microservices Configuration
booksCatalogue:
  url: ${BOOKS_CATALOGUE_URL:http://books-catalogue/api/v1}
